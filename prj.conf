# Hardware
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Shell
CONFIG_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_LOG_CMDS=y

# State machine framework
CONFIG_SMF=y

# Logging
CONFIG_LOG=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096

# zbus
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=64

# CRC for serial protocol
CONFIG_CRC=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Fusain Serial Protocol Library
CONFIG_FUSAIN=y

# Hardware info (device ID)
CONFIG_HWINFO=y
CONFIG_HWINFO_RPI_PICO_CHIP_ID=y

# Random number generator (fallback for device ID)
CONFIG_TEST_RANDOM_GENERATOR=y

# Thread analyzer (stack usage debugging)
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
